name: CI - Build & Push Docker Images
on:
  push:
    branches:
      - main
    # Release: git tag v1.2.0 && git push origin v1.2.0
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

  # Manuell auslösen möglich (sehr hilfreich beim Debuggen)
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_BACKEND:  ${{ github.repository }}/backend
  IMAGE_UI:       ${{ github.repository }}/ui

jobs:

  # ────────────────────────────────────────────────
  #  Job 1 – Build & Test Backend
  # ────────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[backend]') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ./Raspo-Stempelkarten/Stampcard.Backend/package-lock.json

      - name: Install dependencies (Backend)
        working-directory: ./Raspo-Stempelkarten/Stampcard.Backend
        run: npm ci

      - name: Typecheck Backend
        working-directory: ./Raspo-Stempelkarten/Stampcard.Backend
        run: npm run typecheck

      - name: Run Backend Tests
        working-directory: ./Raspo-Stempelkarten/Stampcard.Backend
        run: npm test

      - name: Build Backend
        working-directory: ./Raspo-Stempelkarten/Stampcard.Backend
        run: npm run build

  # ────────────────────────────────────────────────
  #  Job 2 – Build & Test UI / Frontend
  # ────────────────────────────────────────────────
  build-ui:
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[ui]') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies (UI)
        working-directory: ./Raspo-Stempelkarten/Stampcard.UI
        run: dotnet restore

      - name: Build UI
        working-directory: ./Raspo-Stempelkarten/Stampcard.UI
        run: dotnet build --configuration Release --no-restore

      - name: Run UI Tests
        working-directory: ./Raspo-Stempelkarten/Stampcard.UI
        run: dotnet test --no-build --verbosity normal || true   # ← Tests optional machen, falls noch keine existieren

  # ────────────────────────────────────────────────
  #  Job 3 – Docker Build & Push (nur bei Push auf main)
  # ────────────────────────────────────────────────
  docker-build-push:
    needs: [build-backend, build-ui]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags are needed to determine the version

      # SemVer from the latest tag v<major>.<minor>.<patch> plus the commit as build metadata:
      # on the tag 1.2.0+a1b2c3d, 5 commits later 1.2.1-dev.5+a1b2c3d, without any tag 0.0.0-dev.<commits>+a1b2c3d
      - name: Determine version
        id: version
        run: |
          sha=$(git rev-parse --short=7 HEAD)
          if tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null); then
            base=${tag#v}
            commits=$(git rev-list --count "$tag..HEAD")
            if [ "$commits" -eq 0 ]; then
              version="$base+$sha"
            else
              IFS=. read -r major minor patch <<< "$base"
              version="$major.$minor.$((patch + 1))-dev.$commits+$sha"
            fi
          else
            version="0.0.0-dev.$(git rev-list --count HEAD)+$sha"
          fi
          echo "Version: $version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Docker meta (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Docker meta (UI)
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_UI }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Backend Image ───────────────────────────────
      - name: Build & push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./Raspo-Stempelkarten/
          file:    ./Raspo-Stempelkarten/Stampcard.Backend/Dockerfile
          push:    true
          tags:    ${{ steps.meta-backend.outputs.tags }}
          labels:  ${{ steps.meta-backend.outputs.labels }}

      # ─── UI Image ────────────────────────────────────
      - name: Build & push UI
        uses: docker/build-push-action@v6
        with:
          context: ./Raspo-Stempelkarten/
          file:    ./Raspo-Stempelkarten/Stampcard.UI/Dockerfile
          push:    true
          tags:    ${{ steps.meta-ui.outputs.tags }}
          labels:  ${{ steps.meta-ui.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
